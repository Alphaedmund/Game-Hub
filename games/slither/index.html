<!DOCTYPE html>
<html>
<head>
  <title>Slither.io Clone</title>
  <style>
    body { background: #111; color: #fff; text-align: center; font-family: sans-serif; }
    canvas { background: #000; display: block; margin: 2rem auto; border: 2px solid #fff; }
  </style>
</head>
<body>
  <h1>Slither.io (Mini Clone)</h1>
  <canvas id="game" width="600" height="400"></canvas>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    let snake = [{x: 300, y: 200}];
    let dx = 10, dy = 0;
    let food = {x: 100, y: 100};

    function drawSnake() {
      ctx.fillStyle = "lime";
      snake.forEach(part => ctx.fillRect(part.x, part.y, 10, 10));
    }

    function drawFood() {
      ctx.fillStyle = "red";
      ctx.fillRect(food.x, food.y, 10, 10);
    }

    function moveSnake() {
      const head = {x: snake[0].x + dx, y: snake[0].y + dy};
      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        food.x = Math.floor(Math.random() * 60) * 10;
        food.y = Math.floor(Math.random() * 40) * 10;
      } else {
        snake.pop();
      }
    }

    function checkCollision() {
      const head = snake[0];
      if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
        alert("Game Over! Score: " + (snake.length - 1));
        snake = [{x: 300, y: 200}];
        dx = 10; dy = 0;
      }
      for (let i = 1; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          alert("Game Over! Score: " + (snake.length - 1));
          snake = [{x: 300, y: 200}];
          dx = 10; dy = 0;
        }
      }
    }

    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      moveSnake();
      checkCollision();
      drawSnake();
      drawFood();
    }

    document.addEventListener("keydown", e => {
      if (e.key === "ArrowUp" && dy === 0) { dx = 0; dy = -10; }
      if (e.key === "ArrowDown" && dy === 0) { dx = 0; dy = 10; }
      if (e.key === "ArrowLeft" && dx === 0) { dx = -10; dy = 0; }
      if (e.key === "ArrowRight" && dx === 0) { dx = 10; dy = 0; }
    });

    setInterval(update, 100);
  </script>
</body>
</html>
