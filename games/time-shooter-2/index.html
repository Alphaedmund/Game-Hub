<!DOCTYPE html>
<html>
<head>
  <title>Time Shooter 2 Clone</title>
  <style>
    body { background:#111; color:#fff; text-align:center; font-family:sans-serif; }
    canvas { background:#333; display:block; margin:2rem auto; border:2px solid #fff; }
  </style>
</head>
<body>
  <h1>Time Shooter 2 (Mini Clone)</h1>
  <canvas id="game" width="600" height="400"></canvas>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    let player = { x:300, y:350, w:20, h:20 };
    let bullets = [];
    let enemies = [];
    let slowMotion = false;
    let score = 0;

    function drawPlayer() {
      ctx.fillStyle = "lime";
      ctx.fillRect(player.x, player.y, player.w, player.h);
    }

    function drawBullets() {
      ctx.fillStyle = "yellow";
      bullets.forEach(b => ctx.fillRect(b.x, b.y, 5, 10));
    }

    function drawEnemies() {
      ctx.fillStyle = "red";
      enemies.forEach(e => ctx.fillRect(e.x, e.y, 20, 20));
    }

    function drawScore() {
      ctx.fillStyle = "white";
      ctx.font = "20px Arial";
      ctx.fillText("Score: " + score, 20, 30);
    }

    function update() {
      ctx.clearRect(0,0,canvas.width,canvas.height);

      drawPlayer();
      drawBullets();
      drawEnemies();
      drawScore();

      bullets.forEach((b,i) => {
        b.y -= slowMotion ? 2 : 5;
        if (b.y < 0) bullets.splice(i,1);
      });

      enemies.forEach((e,i) => {
        e.y += slowMotion ? 1 : 3;
        if (e.y > canvas.height) enemies.splice(i,1);

        bullets.forEach((b,j) => {
          if (b.x < e.x+20 && b.x+5 > e.x && b.y < e.y+20 && b.y+10 > e.y) {
            enemies.splice(i,1);
            bullets.splice(j,1);
            score++;
          }
        });

        if (player.x < e.x+20 && player.x+player.w > e.x && player.y < e.y+20 && player.y+player.h > e.y) {
          alert("Game Over! Final Score: " + score);
          score = 0;
          bullets = [];
          enemies = [];
        }
      });

      if (Math.random() < 0.02) {
        enemies.push({ x: Math.random()*580, y:0 });
      }
    }

    document.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft" && player.x > 0) player.x -= 20;
      if (e.key === "ArrowRight" && player.x < canvas.width-player.w) player.x += 20;
      if (e.key === " ") bullets.push({ x: player.x+7, y: player.y });
      if (e.key === "Shift") slowMotion = true;
    });

    document.addEventListener("keyup", e => {
      if (e.key === "Shift") slowMotion = false;
    });

    setInterval(update, 1000/60);
  </script>
</body>
</html>
